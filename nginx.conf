server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Serves the .gz files that dotnet publish precompresses
    gzip_static on;

    # nginx drops inherited add_header lines when a location sets its own, so each location includes these.
    # 'wasm-unsafe-eval' is what Blazor needs to compile its WebAssembly; connect-src 'self' is what keeps
    # the page from sending anything to another host.
    set $csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /_framework/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
